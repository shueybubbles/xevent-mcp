name: Build release packages

# Immutable releases: assets must be attached before publishing. Pushing an xelisten-v* tag
# builds the packages and attaches them to a DRAFT release (GitHub does not fire release
# events for drafts). Publishing the draft then triggers the manifest publishing job.
on:
  push:
    tags: ['xelisten-v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: github.event_name != 'release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build packages for release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./packaging/build-packages.ps1 -BaseUrl "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

      - name: Build packages for manual run
        if: github.ref_type != 'tag'
        shell: pwsh
        run: ./packaging/build-packages.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/**

      - name: Attach to draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: artifacts/packages/*

  publish-manifests:
    if: github.event.action == 'published' && startsWith(github.event.release.tag_name, 'xelisten-v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --dir artifacts/packages
      - name: Publish Chocolatey and winget manifests
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: ./packaging/publish-manifests.ps1
